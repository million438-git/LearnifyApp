plugins {
    alias(libs.plugins.android.application)
    id 'com.chaquo.python'
}

android {
    namespace 'com.million.learnify'
    compileSdk 34

    defaultConfig {
        applicationId "com.million.learnify"
        minSdk 24
        targetSdk 34
        versionCode 28
        versionName "2.8 Professional"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        buildConfigField "String", "OPENAI_API_KEY", "\"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\""

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        python {
            version "3.11"
            buildPython "py", "-3.11"

            pip {
                install "rank-bm25"
            }
        }

        multiDexEnabled true
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.generativeai
    implementation libs.guava
    implementation libs.gson
    implementation libs.okhttp
    implementation libs.markwon.core
    implementation libs.retrofit
    implementation libs.retrofit.gson
    implementation libs.androidx.core.splashscreen
    implementation libs.androidx.gridlayout
    
    implementation libs.androidx.coordinatorlayout
    implementation libs.androidx.drawerlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.core.ktx
    
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata

    implementation libs.androidx.camera.core
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.view

    implementation libs.androidx.multidex

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    debugImplementation libs.leakcanary.android
}
