<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; background: #f8fafc; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; max-width: 400px; margin: 0 auto; }
        .element { padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; background: white; cursor: pointer; }
        .element:hover { background: #e2e8f0; }
        .detail { margin-top: 20px; padding: 15px; background: #3b82f6; color: white; border-radius: 10px; display: none; }
        .non-metal { background: #fef08a; }
        .noble { background: #e9d5ff; }
    </style>
</head>
<body>
    <h4>Interactive Periodic Table (Sample)</h4>
    <div class="grid">
        <div class="element non-metal" onclick="show('Hydrogen', 'H', 1, 'Gas')">H</div>
        <div style="grid-column: 5" class="element noble" onclick="show('Helium', 'He', 2, 'Noble Gas')">He</div>
        <div class="element" onclick="show('Lithium', 'Li', 3, 'Alkali Metal')">Li</div>
        <div class="element" onclick="show('Beryllium', 'Be', 4, 'Alkaline Earth')">Be</div>
        <div class="element non-metal" onclick="show('Boron', 'B', 5, 'Metalloid')">B</div>
    </div>
    <div id="detail" class="detail">
        <h2 id="d-name"></h2>
        <p>Symbol: <span id="d-sym"></span> | No: <span id="d-no"></span></p>
        <p id="d-type"></p>
    </div>
    <script>
        function show(n, s, num, t) {
            document.getElementById('detail').style.display = 'block';
            document.getElementById('d-name').innerText = n;
            document.getElementById('d-sym').innerText = s;
            document.getElementById('d-no').innerText = num;
            document.getElementById('d-type').innerText = t;
        }
    </script>
</body>
</html>
