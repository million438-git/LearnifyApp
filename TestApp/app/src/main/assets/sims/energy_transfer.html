<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #0f172a; color: white; margin: 0; padding: 15px; overflow: hidden; touch-action: none; }
        .lab-bench { background: #1e293b; border-radius: 20px; padding: 20px; position: relative; height: 300px; margin-bottom: 20px; border: 1px solid #334155; }
        canvas { display: block; margin: 0 auto; background: #1e293b; }

        .energy-container { display: flex; justify-content: space-around; background: #334155; padding: 15px; border-radius: 15px; }
        .energy-bar-wrap { width: 60px; height: 120px; background: #1e293b; border-radius: 8px; position: relative; overflow: hidden; border: 1px solid #475569; }
        .bar { position: absolute; bottom: 0; width: 100%; transition: height 0.1s linear; }
        .pe { background: #3b82f6; } /* Blue for Potential */
        .ke { background: #10b981; } /* Green for Kinetic */
        .he { background: #f59e0b; } /* Orange for Heat/Sound */

        .label { font-size: 10px; margin-top: 5px; color: #94a3b8; font-weight: bold; }
        .controls { margin-top: 20px; display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; background: #3b82f6; color: white; }
        .reset-btn { background: #ef4444; }

        .hint { font-size: 12px; color: #94a3b8; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="lab-bench">
        <canvas id="energyCanvas"></canvas>
    </div>

    <div class="energy-container">
        <div>
            <div class="energy-bar-wrap"><div id="barPE" class="bar pe" style="height: 100%;"></div></div>
            <div class="label">POTENTIAL</div>
        </div>
        <div>
            <div class="energy-bar-wrap"><div id="barKE" class="bar ke" style="height: 0%;"></div></div>
            <div class="label">KINETIC</div>
        </div>
        <div>
            <div class="energy-bar-wrap"><div id="barHE" class="bar he" style="height: 0%;"></div></div>
            <div class="label">HEAT/SOUND</div>
        </div>
    </div>

    <div class="controls">
        <button onclick="dropBall()">▶ Drop Ball</button>
        <button class="reset-btn" onclick="resetSim()">🔄 Reset</button>
    </div>

    <div class="hint">
        <b>Law of Conservation:</b> Energy cannot be destroyed. As the ball falls, Blue (PE) turns into Green (KE). When it hits the floor, some energy escapes as Orange (Heat/Sound).
    </div>

    <script>
        const canvas = document.getElementById('energyCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 300;
        canvas.height = 300;

        let ballY = 50;
        let velocity = 0;
        let gravity = 0.25;
        let isMoving = false;
        let totalEnergy = 100;
        let currentPE = 100;
        let currentKE = 0;
        let currentHE = 0;
        let bounceCount = 0;

        function dropBall() { if(!isMoving && currentPE > 5) isMoving = true; }

        function resetSim() {
            isMoving = false;
            ballY = 50;
            velocity = 0;
            currentPE = 100;
            currentKE = 0;
            currentHE = 0;
            bounceCount = 0;
            updateBars();
        }

        function updateBars() {
            document.getElementById('barPE').style.height = currentPE + "%";
            document.getElementById('barKE').style.height = currentKE + "%";
            document.getElementById('barHE').style.height = currentHE + "%";
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(50, 280);
            ctx.lineTo(250, 280);
            ctx.stroke();

            if (isMoving) {
                velocity += gravity;
                ballY += velocity;

                // Hit ground
                if (ballY > 265) {
                    ballY = 265;
                    velocity *= -0.7; // Lose energy on bounce
                    bounceCount++;

                    // Convert some remaining energy to heat/sound
                    let loss = (currentPE + currentKE) * 0.15;
                    currentHE = Math.min(100, currentHE + loss);

                    if (Math.abs(velocity) < 1) {
                        isMoving = false;
                        velocity = 0;
                    }
                }

                // Calculate energy proportions
                let heightFactor = (265 - ballY) / 215;
                let vFactor = (velocity * velocity) / 100; // Simplified kinetic energy visual

                let remainingReal = 100 - currentHE;
                currentPE = Math.max(0, heightFactor * remainingReal);
                currentKE = Math.max(0, remainingReal - currentPE);
            }

            updateBars();

            // Draw Ball
            ctx.fillStyle = '#ef4444';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ef4444';
            ctx.beginPath();
            ctx.arc(150, ballY, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
