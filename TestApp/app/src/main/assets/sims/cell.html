<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0fdf4; padding: 10px; }
        .cell { width: 250px; height: 250px; border: 5px solid #16a34a; border-radius: 50% 60% 50% 40%; margin: 20px auto; position: relative; background: #dcfce7; }
        .nucleus { width: 60px; height: 60px; background: #86198f; border-radius: 50%; position: absolute; top: 90px; left: 90px; cursor: pointer; }
        .mitochondria { width: 40px; height: 20px; background: #dc2626; border-radius: 10px; position: absolute; top: 50px; left: 40px; transform: rotate(30deg); cursor: pointer; }
        .label-box { margin-top: 20px; padding: 15px; background: white; border-radius: 10px; border: 1px solid #16a34a; min-height: 50px; }
    </style>
</head>
<body>
    <h3>Biology: Animal Cell Explorer</h3>
    <p>Tap organelles to learn their function!</p>
    <div class="cell">
        <div class="nucleus" onclick="info('Nucleus', 'The control center. Contains DNA.')"></div>
        <div class="mitochondria" onclick="info('Mitochondria', 'Powerhouse of the cell. Produces ATP energy.')"></div>
        <div class="mitochondria" style="top:180px; left:160px; transform:rotate(-20deg);" onclick="info('Mitochondria', 'Energy production happens here.')"></div>
    </div>
    <div class="label-box" id="info">Tap an organelle...</div>
    <script>
        function info(name, desc) {
            document.getElementById('info').innerHTML = `<b>${name}</b><br>${desc}`;
        }
    </script>
</body>
</html>
