<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; background: #0f172a; color: white; overflow: hidden; touch-action: none; }
        canvas { background: #0f172a; display: block; }
        .controls { position: absolute; top: 0; width: 100%; padding: 15px; background: rgba(30, 41, 59, 0.9); box-sizing: border-box; border-bottom: 1px solid #334155; z-index: 10; }
        .footer-info { position: absolute; bottom: 0; width: 100%; padding: 10px; background: rgba(30, 41, 59, 0.8); font-size: 12px; color: #94a3b8; }
        button { padding: 8px 15px; margin: 5px; border: none; border-radius: 6px; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        button.pos { background: #ef4444; }
        button.neg { background: #3b82f6; }
        button.clear { background: #475569; }
        .mode-btn { border: 1px solid #3b82f6; background: transparent; }
        .active-mode { background: #3b82f6 !important; }
    </style>
</head>
<body>
    <div class="controls">
        <b>Electrostatics Lab</b><br>
        <button class="pos" onclick="addCharge(1)">+ Add Balloon</button>
        <button class="neg" onclick="addCharge(-1)">- Add Paper</button>
        <button class="clear" onclick="clearLab()">🗑️ Clear</button>
    </div>

    <canvas id="fieldCanvas"></canvas>

    <div class="footer-info">
        <b>Real Science:</b> Charges create invisible <b>Field Lines</b>. Opposite charges (+ and -) attract, while same charges repel. Notice how lines flow from + to -.
    </div>

    <script>
        const canvas = document.getElementById('fieldCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let charges = [
            {x: canvas.width/2 - 50, y: canvas.height/2, q: 1, isDragging: false},
            {x: canvas.width/2 + 50, y: canvas.height/2, q: -1, isDragging: false}
        ];

        function addCharge(q) {
            charges.push({x: Math.random() * (canvas.width - 100) + 50, y: Math.random() * (canvas.height - 200) + 100, q: q, isDragging: false});
        }

        function clearLab() {
            charges = [];
        }

        function drawArrow(fromx, fromy, tox, toy) {
            const headlen = 5;
            const dx = tox - fromx;
            const dy = toy - fromy;
            const angle = Math.atan2(dy, dx);
            ctx.moveTo(fromx, fromy);
            ctx.lineTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw field lines with direction arrows
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            const step = 35;
            for (let x = step/2; x < canvas.width; x += step) {
                for (let y = step/2 + 80; y < canvas.height - 40; y += step) {
                    let fx = 0, fy = 0;
                    charges.forEach(c => {
                        let dx = x - c.x;
                        let dy = y - c.y;
                        let r2 = dx*dx + dy*dy + 500;
                        let r = Math.sqrt(r2);
                        // E = kQ/r^2
                        fx += (c.q * dx) / (r * r2);
                        fy += (c.q * dy) / (r * r2);
                    });

                    let mag = Math.sqrt(fx*fx + fy*fy);
                    if (mag > 0.00001) {
                        ctx.beginPath();
                        let len = 15;
                        let tx = x + (fx/mag) * len;
                        let ty = y + (fy/mag) * len;
                        drawArrow(x, y, tx, ty);
                        ctx.stroke();
                    }
                }
            }

            // Draw charges (Balloons / Paper)
            charges.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, 15, 0, Math.PI * 2);
                ctx.fillStyle = c.q > 0 ? '#ef4444' : '#3b82f6';
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(c.q > 0 ? '+' : '-', c.x, c.y + 5);

                // Outer glow for active charge
                ctx.beginPath();
                ctx.arc(c.x, c.y, 20, 0, Math.PI * 2);
                ctx.strokeStyle = c.q > 0 ? 'rgba(239, 68, 68, 0.3)' : 'rgba(59, 130, 246, 0.3)';
                ctx.stroke();
            });

            requestAnimationFrame(draw);
        }

        // Drag and Drop Logic
        let dragTarget = null;

        canvas.addEventListener('mousedown', e => {
            charges.forEach(c => {
                if (Math.hypot(c.x - e.clientX, c.y - e.clientY) < 25) {
                    dragTarget = c;
                }
            });
        });

        canvas.addEventListener('mousemove', e => {
            if (dragTarget) {
                dragTarget.x = e.clientX;
                dragTarget.y = e.clientY;
            }
        });

        canvas.addEventListener('mouseup', () => dragTarget = null);

        // Touch support
        canvas.addEventListener('touchstart', e => {
            const touch = e.touches[0];
            charges.forEach(c => {
                if (Math.hypot(c.x - touch.clientX, c.y - touch.clientY) < 30) {
                    dragTarget = c;
                }
            });
        });

        canvas.addEventListener('touchmove', e => {
            if (dragTarget) {
                const touch = e.touches[0];
                dragTarget.x = touch.clientX;
                dragTarget.y = touch.clientY;
                e.preventDefault();
            }
        });

        canvas.addEventListener('touchend', () => dragTarget = null);

        draw();
    </script>
</body>
</html>
