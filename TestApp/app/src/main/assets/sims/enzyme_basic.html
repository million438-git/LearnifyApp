<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        body { margin: 0; background: #fdfcf0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .test-tube { width: 30px; height: 120px; border: 2px solid #64748b; border-radius: 0 0 15px 15px; background: rgba(255,255,255,0.8); position: relative; overflow: hidden; }
        .liquid { position: absolute; bottom: 0; width: 100%; height: 40%; background: #bae6fd; transition: height 2s; }
        #timer { font-size: 32px; font-weight: bold; color: #0369a1; margin-top: 20px; }
        #status { color: #64748b; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="test-tube">
        <div id="liquid" class="liquid"></div>
    </div>
    <div id="timer">0.0s</div>
    <div id="status">Add saliva to start starch breakdown</div>
    <script>
        let running = false;
        let time = 0;
        let interval;
        function interact() {
            if (running) return;
            running = true;
            document.getElementById('status').innerText = "Reaction in progress...";
            document.getElementById('liquid').style.height = '10%';
            interval = setInterval(() => {
                time += 0.1;
                document.getElementById('timer').innerText = time.toFixed(1) + "s";
                if (time >= 5.0) {
                    clearInterval(interval);
                    document.getElementById('status').innerText = "Reaction Complete: Starch Digested!";
                    document.getElementById('status').style.color = "#10b981";
                }
            }, 100);
        }
    </script>
</body>
</html>
