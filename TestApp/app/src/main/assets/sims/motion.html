<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f1f5f9; color: #1e293b; margin: 0; padding: 15px; overflow-x: hidden; }
        .lab-bench { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; position: relative; }
        #motionCanvas { background: #f8fafc; border-radius: 12px; width: 100%; height: 200px; touch-action: none; border: 1px solid #e2e8f0; }
        .controls { background: #1e293b; color: white; padding: 20px; border-radius: 20px; text-align: left; }
        .control-row { margin-bottom: 15px; }
        label { display: block; font-size: 14px; margin-bottom: 8px; color: #94a3b8; }
        input[type=range] { width: 100%; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-start { background: #10b981; color: white; }
        .btn-reset { background: #ef4444; color: white; }
        .btn-slow { background: #3b82f6; color: white; }
        .active-slow { background: #fbbf24; color: #1e293b; }

        .graph-container { background: white; border-radius: 20px; padding: 15px; margin-top: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        canvas#speedChart { width: 100% !important; height: 150px !important; }

        .stats-overlay { position: absolute; top: 30px; left: 30px; text-align: left; pointer-events: none; }
        .stat-item { background: rgba(255,255,255,0.8); padding: 4px 8px; border-radius: 6px; margin-bottom: 4px; font-size: 12px; font-weight: bold; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="lab-bench">
        <div class="stats-overlay">
            <div class="stat-item">Vel: <span id="txtVel">0.0</span> m/s</div>
            <div class="stat-item">Acc: <span id="txtAcc">0.0</span> m/s²</div>
        </div>
        <canvas id="motionCanvas"></canvas>
    </div>

    <div class="controls">
        <div class="control-row">
            <label>Slope Angle: <span id="angleVal">15</span>°</label>
            <input type="range" id="angleInput" min="5" max="45" value="15" oninput="updateAngle()">
        </div>
        <div class="btn-group">
            <button class="btn-start" id="startBtn" onclick="toggleMotion()">▶ Start</button>
            <button class="btn-slow" id="slowBtn" onclick="toggleSlowMo()">🕒 Slow Mo</button>
            <button class="btn-reset" onclick="resetSim()">🔄 Reset</button>
        </div>
    </div>

    <div class="graph-container">
        <label>Live Speed vs Time Graph</label>
        <canvas id="speedChart"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('motionCanvas');
        const ctx = canvas.getContext('2d');
        const speedCtx = document.getElementById('speedChart').getContext('2d');

        let width, height;
        function resize() {
            width = canvas.clientWidth;
            height = canvas.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        let angle = 15;
        let isRunning = false;
        let isSlowMo = false;
        let time = 0;
        let ballPos = 0;
        let velocity = 0;
        let acceleration = 0;
        let history = { t: [], v: [] };
        let markers = [];

        // Chart.js Setup
        let chart = new Chart(speedCtx, {
            type: 'line',
            data: {
                labels: history.t,
                datasets: [{
                    label: 'Speed (m/s)',
                    data: history.v,
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    fill: true,
                    pointRadius: 0,
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                animation: false,
                scales: {
                    x: { display: false },
                    y: { beginAtZero: true, max: 15 }
                }
            }
        });

        function updateAngle() {
            angle = document.getElementById('angleInput').value;
            document.getElementById('angleVal').innerText = angle;
            acceleration = 9.8 * Math.sin(angle * Math.PI / 180);
            document.getElementById('txtAcc').innerText = acceleration.toFixed(1);
            if (!isRunning) resetSim();
        }

        function toggleMotion() {
            isRunning = !isRunning;
            document.getElementById('startBtn').innerText = isRunning ? "⏸ Pause" : "▶ Start";
        }

        function toggleSlowMo() {
            isSlowMo = !isSlowMo;
            document.getElementById('slowBtn').classList.toggle('active-slow', isSlowMo);
        }

        function resetSim() {
            isRunning = false;
            time = 0;
            ballPos = 0;
            velocity = 0;
            history.t = [];
            history.v = [];
            markers = [];
            chart.data.labels = [];
            chart.data.datasets[0].data = [];
            chart.update();
            document.getElementById('startBtn').innerText = "▶ Start";
            document.getElementById('txtVel').innerText = "0.0";
            updateAngle();
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            const startX = 50;
            const startY = 50;
            const endX = width - 50;
            const endY = height - 50;
            const rad = angle * Math.PI / 180;

            // Draw Slope
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();

            // Draw Ground
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, endY + 4);
            ctx.lineTo(width, endY + 4);
            ctx.stroke();

            if (isRunning) {
                let dt = isSlowMo ? 0.005 : 0.02;
                time += dt;
                velocity += acceleration * dt;
                ballPos += velocity * 5; // Scale for visual

                if (time % 0.5 < dt) {
                    markers.push({x: startX + ballPos * Math.cos(rad), y: startY + ballPos * Math.sin(rad)});
                }

                if (history.t.length < 100) {
                    history.t.push(time.toFixed(1));
                    history.v.push(velocity.toFixed(2));
                    chart.update();
                }

                document.getElementById('txtVel').innerText = velocity.toFixed(1);
            }

            // Draw Time Markers (Path)
            ctx.fillStyle = '#94a3b8';
            markers.forEach(m => {
                ctx.beginPath();
                ctx.arc(m.x, m.y, 2, 0, Math.PI*2);
                ctx.fill();
            });

            // Calculate current ball coords
            let bx = startX + ballPos * Math.cos(rad);
            let by = startY + ballPos * Math.sin(rad);

            if (bx > endX) {
                isRunning = false;
                document.getElementById('startBtn').innerText = "▶ Start";
            }

            // Draw Ball
            ctx.fillStyle = '#ef4444';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(239, 68, 68, 0.5)';
            ctx.beginPath();
            ctx.arc(bx, by - 12, 12, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw Speed Arrow (Grows with velocity)
            if (velocity > 0.1) {
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 3;
                let arrowLen = velocity * 10;
                ctx.beginPath();
                ctx.moveTo(bx, by - 12);
                ctx.lineTo(bx + arrowLen * Math.cos(rad), by - 12 + arrowLen * Math.sin(rad));
                ctx.stroke();
                // Arrow head
                ctx.fillStyle = '#10b981';
                ctx.beginPath();
                ctx.arc(bx + arrowLen * Math.cos(rad), by - 12 + arrowLen * Math.sin(rad), 4, 0, Math.PI*2);
                ctx.fill();
            }

            requestAnimationFrame(draw);
        }

        updateAngle();
        draw();
    </script>
</body>
</html>
