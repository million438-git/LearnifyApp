<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        body { margin: 0; background: #fdf6e3; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .bins { display: flex; gap: 20px; margin-top: 50px; }
        .bin { width: 120px; height: 120px; border: 3px dashed #856404; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.5); font-weight: bold; color: #856404; }
        .items { display: flex; gap: 15px; margin-top: 30px; }
        .item { width: 60px; height: 60px; background: white; border: 2px solid #dee2e6; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: grab; font-size: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #status { margin-top: 30px; font-weight: bold; color: #155724; }
    </style>
</head>
<body>
    <h3>Drag Items to Correct Kingdom</h3>
    <div class="items">
        <div class="item" draggable="true">🦁</div>
        <div class="item" draggable="true">🌳</div>
        <div class="item" draggable="true">🍄</div>
    </div>
    <div class="bins">
        <div class="bin">Animalia</div>
        <div class="bin">Plantae</div>
        <div class="bin">Fungi</div>
    </div>
    <div id="status">Ready to classify</div>
    <script>
        function interact() {
            document.getElementById('status').innerText = "Classification Success: Organisms grouped by biological kingdoms!";
        }
    </script>
</body>
</html>
