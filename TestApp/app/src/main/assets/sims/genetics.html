<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        body { margin: 0; background: #fff1f2; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .punnett { display: grid; grid-template-columns: 40px 100px 100px; grid-template-rows: 40px 100px 100px; gap: 5px; background: white; padding: 10px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .cell { border: 1px solid #fda4af; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
        .label { background: #ffe4e6; color: #be185d; }
        .result { background: #fff1f2; color: #e11d48; }
        .stats { margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="punnett">
        <div></div><div class="cell label">B</div><div class="cell label">b</div>
        <div class="cell label">B</div><div class="cell result">BB</div><div class="cell result">Bb</div>
        <div class="cell label">b</div><div class="cell result">Bb</div><div class="cell result">bb</div>
    </div>
    <div class="stats">
        <b>Genotype Ratio:</b> 1:2:1<br/>
        <b>Phenotype:</b> 75% Brown, 25% Blue
    </div>
    <script>
        function calculate() { location.reload(); }
    </script>
</body>
</html>
