<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 20px; overflow: hidden; }
        .wire { width: 100%; height: 60px; background: #334155; border: 3px solid #64748b; border-radius: 30px; position: relative; margin: 50px 0; overflow: hidden; }
        .electron { width: 12px; height: 12px; background: #fbbf24; border-radius: 50%; position: absolute; top: 24px; box-shadow: 0 0 10px #fbbf24; animation: flow 2s infinite linear; }
        @keyframes flow {
            from { left: -20px; }
            to { left: 110%; }
        }
        .desc { background: #1e293b; padding: 15px; border-radius: 10px; text-align: left; line-height: 1.6; }
        b { color: #fbbf24; }
    </style>
</head>
<body>
    <h3>🎥 Micro-Animation: Electron Flow</h3>
    <div class="wire">
        <div class="electron" style="animation-delay: 0s;"></div>
        <div class="electron" style="animation-delay: 0.4s;"></div>
        <div class="electron" style="animation-delay: 0.8s;"></div>
        <div class="electron" style="animation-delay: 1.2s;"></div>
        <div class="electron" style="animation-delay: 1.6s;"></div>
    </div>
    <div class="desc">
        <b>What is happening?</b><br>
        In a conductor, <b>electrons</b> (negative charges) drift in a specific direction when a potential difference is applied. This collective movement is what we call <b>Electric Current</b>.
    </div>
</body>
</html>
