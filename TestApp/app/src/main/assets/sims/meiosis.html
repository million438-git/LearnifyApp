<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        body { margin: 0; background: #fdf2f8; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        canvas { background: white; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 4px solid #db2777; }
        #info { margin-top: 20px; text-align: center; }
        #phase { font-size: 24px; font-weight: bold; color: #9d174d; }
        #desc { font-size: 14px; color: #be185d; max-width: 300px; margin-top: 5px; }
    </style>
</head>
<body>
    <canvas id="meiosisCanvas" width="320" height="320"></canvas>
    <div id="info">
        <div id="phase">Meiosis: Prophase I</div>
        <div id="desc">Homologous chromosomes pair up and exchange genetic material (crossing over).</div>
    </div>
    <script>
        const canvas = document.getElementById('meiosisCanvas');
        const ctx = canvas.getContext('2d');
        let step = 0;
        const phases = [
            { n: "Prophase I", d: "Crossing over occurs between homologous chromosomes." },
            { n: "Metaphase I", d: "Homologous pairs line up at the center." },
            { n: "Anaphase I", d: "Pairs separate, pulling whole chromosomes to poles." },
            { n: "Telophase I", d: "Two haploid cells form." },
            { n: "Prophase II", d: "Chromosomes condense again in both cells." },
            { n: "Metaphase II", d: "Chromosomes line up in both cells." },
            { n: "Anaphase II", d: "Sister chromatids finally separate." },
            { n: "Telophase II", d: "Four unique haploid gametes are formed." }
        ];

        function draw() {
            ctx.clearRect(0, 0, 320, 320);
            const cx = 160, cy = 160;
            ctx.beginPath(); ctx.arc(cx, cy, 150, 0, Math.PI*2);
            ctx.fillStyle = "#fff1f2"; ctx.fill();
            ctx.strokeStyle = "#fb7185"; ctx.lineWidth = 3; ctx.stroke();

            ctx.font = "14px Arial"; ctx.fillStyle = "#db2777";
            if(step < 4) {
                // Meiosis I visuals
                drawChrom(cx-20, cy, "#ef4444", "#3b82f6", step===0);
            } else {
                // Meiosis II visuals
                ctx.beginPath(); ctx.moveTo(40, 160); ctx.lineTo(280, 160); ctx.stroke();
                drawChrom(cx, cy-70, "#ef4444", "#3b82f6", false);
                drawChrom(cx, cy+70, "#10b981", "#f59e0b", false);
            }
        }

        function drawChrom(x, y, c1, c2, crossing) {
            ctx.lineWidth = 4;
            ctx.strokeStyle = c1; ctx.beginPath(); ctx.moveTo(x-10, y-20); ctx.lineTo(x+10, y+20); ctx.stroke();
            ctx.strokeStyle = c2; ctx.beginPath(); ctx.moveTo(x+10, y-20); ctx.lineTo(x-10, y+20); ctx.stroke();
            if(crossing) {
                ctx.fillStyle = "rgba(255,255,0,0.5)"; ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI*2); ctx.fill();
            }
        }

        function nextStep() {
            step = (step + 1) % phases.length;
            document.getElementById('phase').innerText = "Meiosis: " + phases[step].n;
            document.getElementById('desc').innerText = phases[step].d;
            draw();
        }
        function resetSim() { step = 0; draw(); }
        draw();
    </script>
</body>
</html>
