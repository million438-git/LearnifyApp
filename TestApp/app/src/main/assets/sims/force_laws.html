<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #0f172a; color: white; margin: 0; padding: 15px; touch-action: none; }
        .lab-bench { background: #1e293b; border-radius: 20px; padding: 20px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); margin-bottom: 20px; position: relative; height: 250px; overflow: hidden; }
        canvas { display: block; margin: 0 auto; background: #1e293b; border-radius: 10px; }
        .controls { background: #334155; padding: 15px; border-radius: 15px; text-align: left; }
        .control-row { margin-bottom: 15px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; color: #94a3b8; }
        input[type=range] { width: 100%; height: 8px; border-radius: 5px; background: #475569; outline: none; -webkit-appearance: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #3b82f6; cursor: pointer; }
        .stats-overlay { position: absolute; top: 10px; left: 10px; text-align: left; pointer-events: none; }
        .stat-item { background: rgba(15, 23, 42, 0.7); padding: 4px 8px; border-radius: 6px; margin-bottom: 4px; font-size: 12px; font-weight: bold; border: 1px solid #334155; }
        .exp { font-size: 13px; color: #94a3b8; margin-top: 10px; line-height: 1.4; }
        b { color: #3b82f6; }
    </style>
</head>
<body>
    <div class="lab-bench">
        <div class="stats-overlay">
            <div class="stat-item">Applied Force ($F$): <span id="txtForce">0</span> N</div>
            <div class="stat-item">Friction ($f$): <span id="txtFric">0</span> N</div>
            <div class="stat-item">Net Force ($F_{net}$): <span id="txtNet">0</span> N</div>
            <div class="stat-item">Accel ($a$): <span id="txtAcc">0</span> m/s²</div>
        </div>
        <canvas id="forceCanvas"></canvas>
    </div>

    <div class="controls">
        <div class="control-row">
            <label>Mass ($m$): <span id="massVal">5</span> kg</label>
            <input type="range" id="massInput" min="1" max="20" value="5" oninput="updateParams()">
        </div>
        <div class="control-row">
            <label>Friction Coeff ($\mu$): <span id="muVal">0.3</span></label>
            <input type="range" id="muInput" min="0" max="1" step="0.05" value="0.3" oninput="updateParams()">
        </div>
        <div class="control-row">
            <label>Pushing Force ($F$): <span id="pushVal">0</span> N</label>
            <input type="range" id="pushInput" min="0" max="100" value="0" oninput="updateParams()">
        </div>
        <div class="exp">
            <b>Newton's 2nd Law:</b> $F_{net} = m \cdot a$. Friction always opposes motion. If $F < f_{static}$, the book won't move!
        </div>
    </div>

    <script>
        const canvas = document.getElementById('forceCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.clientWidth;
            height = canvas.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        resize();

        let mass = 5;
        let mu = 0.3;
        let appliedForce = 0;
        let velocity = 0;
        let acceleration = 0;
        let pos = 100;
        const g = 9.8;

        function updateParams() {
            mass = parseFloat(document.getElementById('massInput').value);
            mu = parseFloat(document.getElementById('muInput').value);
            appliedForce = parseFloat(document.getElementById('pushInput').value);

            document.getElementById('massVal').innerText = mass;
            document.getElementById('muVal').innerText = mu.toFixed(2);
            document.getElementById('pushVal').innerText = appliedForce;

            if (velocity === 0 && appliedForce === 0) {
                pos = 100;
            }
        }

        function drawArrow(x, y, length, color, label, direction) {
            if (Math.abs(length) < 5) return;
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + length * direction, y);
            ctx.stroke();

            // Arrow head
            ctx.beginPath();
            ctx.moveTo(x + length * direction, y);
            ctx.lineTo(x + (length-10) * direction, y - 5);
            ctx.lineTo(x + (length-10) * direction, y + 5);
            ctx.fill();

            ctx.font = '10px Arial';
            ctx.fillText(label, x + (length/2) * direction - 10, y - 10);
        }

        function update() {
            const frictionMax = mu * mass * g;
            let currentFriction = 0;

            if (velocity === 0) {
                if (appliedForce > frictionMax) {
                    currentFriction = frictionMax;
                    acceleration = (appliedForce - currentFriction) / mass;
                } else {
                    currentFriction = appliedForce;
                    acceleration = 0;
                }
            } else {
                currentFriction = frictionMax;
                acceleration = (appliedForce - currentFriction) / mass;
            }

            velocity += acceleration * 0.02;
            if (velocity < 0) {
                velocity = 0;
                acceleration = 0;
            }

            pos += velocity;
            if (pos > width - 60) {
                pos = width - 60;
                velocity = 0;
            }
            if (pos < 20) {
                pos = 20;
                velocity = 0;
            }

            document.getElementById('txtForce').innerText = appliedForce.toFixed(1);
            document.getElementById('txtFric').innerText = currentFriction.toFixed(1);
            document.getElementById('txtNet').innerText = (appliedForce - currentFriction).toFixed(1);
            document.getElementById('txtAcc').innerText = acceleration.toFixed(2);

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Floor
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 180);
            ctx.lineTo(width, 180);
            ctx.stroke();

            // The Book (Block)
            const bWidth = 40 + mass * 2;
            const bHeight = 30 + mass;
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(pos, 180 - bHeight, bWidth, bHeight);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 1;
            ctx.strokeRect(pos, 180 - bHeight, bWidth, bHeight);

            // Center of block
            const cx = pos + bWidth/2;
            const cy = 180 - bHeight/2;

            // Force Arrows
            drawArrow(cx + bWidth/2, cy, appliedForce, '#10b981', 'Applied', 1);

            const frictionMax = mu * mass * g;
            let fDisp = (velocity > 0 || appliedForce > 0) ? (appliedForce > frictionMax ? frictionMax : appliedForce) : 0;
            drawArrow(cx - bWidth/2, cy, fDisp, '#ef4444', 'Friction', -1);
        }

        update();
    </script>
</body>
</html>
