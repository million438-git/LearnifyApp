<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        body { margin: 0; background: #f0f9ff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .setup { display: flex; gap: 20px; align-items: flex-end; }
        .respirometer { width: 60px; height: 150px; border: 3px solid #0369a1; border-radius: 30px 30px 5px 5px; position: relative; background: white; }
        .liquid { position: absolute; bottom: 0; width: 100%; height: 30%; background: #38bdf8; transition: height 0.3s; }
        .yeast { position: absolute; bottom: 5px; left: 10px; width: 40px; height: 20px; background: #d1d5db; border-radius: 10px; }
        #gas-vol { font-size: 32px; font-weight: bold; color: #0369a1; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="setup">
        <div class="respirometer">
            <div id="liquid" class="liquid"></div>
            <div class="yeast"></div>
        </div>
    </div>
    <div id="gas-vol">CO2: 0 ml</div>
    <script>
        let time = 0;
        function nextStep() {
            time += 5;
            document.getElementById('liquid').style.height = (30 + time) + '%';
            document.getElementById('gas-vol').innerText = "CO2: " + (time/2).toFixed(1) + " ml";
        }
        function resetSim() { time = 0; nextStep(); time = 0; }
    </script>
</body>
</html>
