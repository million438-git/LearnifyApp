<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; background: #fff1f2; padding: 20px; overflow: hidden; }
        .rod { width: 100%; height: 40px; background: #94a3b8; border-radius: 5px; position: relative; margin: 60px 0; display: flex; align-items: center; justify-content: space-around; }
        .atom { width: 25px; height: 25px; background: #ef4444; border-radius: 50%; position: relative; }
        @keyframes vibrate {
            0% { transform: translate(0,0); }
            25% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, 1px); }
            75% { transform: translate(1px, -2px); }
            100% { transform: translate(0,0); }
        }
        .desc { background: white; padding: 15px; border-radius: 10px; text-align: left; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <h3>🎥 Micro-Animation: Heat Conduction</h3>
    <div class="rod" id="rod">
        <div class="atom" style="animation: vibrate 0.1s infinite;"></div>
        <div class="atom" style="animation: vibrate 0.3s infinite;"></div>
        <div class="atom" style="animation: vibrate 0.6s infinite;"></div>
        <div class="atom" style="animation: vibrate 1s infinite;"></div>
        <div class="atom" style="animation: vibrate 2s infinite;"></div>
    </div>
    <div class="desc">
        <b>What is happening?</b><br>
        Heat is the <b>kinetic energy</b> of atoms. When one end is heated, atoms vibrate faster and collide with neighbors, transferring energy down the rod.
    </div>
</body>
</html>
