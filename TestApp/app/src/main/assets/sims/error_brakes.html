<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; background: #fffbeb; padding: 20px; overflow: hidden; }
        .road { width: 100%; height: 10px; background: #475569; position: absolute; bottom: 80px; left: 0; }
        .car { width: 80px; height: 40px; background: #1e293b; border-radius: 8px; position: absolute; bottom: 90px; left: -100px; }
        .wheel { width: 20px; height: 20px; background: #64748b; border-radius: 50%; position: absolute; bottom: -10px; border: 2px solid white; }
        .wall { width: 20px; height: 100px; background: #ef4444; position: absolute; right: 20px; bottom: 80px; border-radius: 5px; }

        .spark { position: absolute; width: 4px; height: 4px; background: #f59e0b; border-radius: 50%; opacity: 0; }
        @keyframes sparking {
            0% { transform: translate(0,0); opacity: 1; }
            100% { transform: translate(-20px, -20px); opacity: 0; }
        }

        .alert-box { background: #7f1d1d; color: white; padding: 15px; border-radius: 10px; text-align: left; margin-top: 150px; display: none; }
        button { padding: 12px 24px; background: #b91c1c; color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <h3>⚠️ Error Alert: Brake Failure</h3>
    <p>Simulating <b>Kinetic Energy</b> vs. <b>Friction</b>.</p>

    <div class="road"></div>
    <div class="wall"></div>
    <div class="car" id="car">
        <div class="wheel" style="left: 5px;"></div>
        <div class="wheel" style="right: 5px;"></div>
        <div id="spark1" class="spark" style="bottom: -5px; left: 0;"></div>
    </div>

    <div class="alert-box" id="alert">
        <b>🚨 CRASH DETECTED</b><br>
        Brake pads failed due to <b>Glazing</b> (overheating). Friction coefficient dropped to near zero. Velocity was too high to stop in time.
    </div>

    <button onclick="startSim()">▶ Emergency Braking Test</button>

    <script>
        function startSim() {
            let car = document.getElementById('car');
            let alert = document.getElementById('alert');
            let spark = document.getElementById('spark1');
            alert.style.display = 'none';
            car.style.left = '-100px';
            car.style.transition = 'none';

            setTimeout(() => {
                // High speed entry
                car.style.transition = 'left 2s linear';
                car.style.left = '60%';

                setTimeout(() => {
                    // Try to brake - FAIL
                    spark.style.animation = 'sparking 0.1s infinite';
                    car.style.transition = 'left 1.5s ease-out';
                    car.style.left = 'calc(100% - 100px)'; // Hits wall

                    setTimeout(() => {
                        spark.style.animation = 'none';
                        alert.style.display = 'block';
                        document.body.style.backgroundColor = '#fecaca';
                    }, 1500);
                }, 1000);
            }, 100);
        }
    </script>
</body>
</html>
