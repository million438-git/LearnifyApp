<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        body { margin: 0; background: #fdfcf0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .beaker { width: 100px; height: 120px; border: 3px solid #64748b; border-top: none; border-radius: 0 0 20px 20px; position: relative; background: rgba(255,255,255,0.8); overflow: hidden; }
        .liquid { position: absolute; bottom: 0; width: 100%; height: 50%; background: #bae6fd; transition: all 0.5s; }
        .bubbles { position: absolute; width: 100%; bottom: 0; display: none; }
        .bubble { width: 5px; height: 5px; background: white; border-radius: 50%; position: absolute; animation: rise 1s infinite; }
        @keyframes rise { 0% { bottom: 0; opacity: 1; } 100% { bottom: 60px; opacity: 0; } }
        .controls-info { margin-top: 20px; text-align: center; }
        #reaction-rate { font-size: 24px; font-weight: bold; color: #0369a1; }
    </style>
</head>
<body>
    <div class="beaker">
        <div id="liquid" class="liquid"></div>
        <div id="bubbles" class="bubbles">
            <div class="bubble" style="left:20%; animation-delay: 0.1s"></div>
            <div class="bubble" style="left:40%; animation-delay: 0.3s"></div>
            <div class="bubble" style="left:60%; animation-delay: 0.2s"></div>
            <div class="bubble" style="left:80%; animation-delay: 0.4s"></div>
        </div>
    </div>
    <div class="controls-info">
        Reaction Rate: <span id="reaction-rate">0</span> units/sec<br/>
        <small id="status">Adjust Temp/pH to see enzyme activity</small>
    </div>
    <script>
        let temp = 25;
        let ph = 7;

        function updateReaction() {
            // Enzyme activity curve (bell shape for temp and pH)
            let tempEffect = Math.max(0, 1 - Math.pow((temp - 37)/30, 2));
            let phEffect = Math.max(0, 1 - Math.pow((ph - 7)/3, 2));
            let rate = Math.round(tempEffect * phEffect * 100);

            document.getElementById('reaction-rate').innerText = rate;
            document.getElementById('bubbles').style.display = rate > 10 ? 'block' : 'none';
            document.getElementById('liquid').style.height = (40 + rate/10) + '%';

            if (temp > 60) {
                document.getElementById('status').innerText = "Enzyme Denatured! (High Temp)";
                document.getElementById('status').style.color = "#ef4444";
            } else {
                document.getElementById('status').innerText = "Active reaction at current parameters";
                document.getElementById('status').style.color = "#0369a1";
            }
        }

        function setTemp(val) { temp = val; updateReaction(); }
        function setPH(val) { ph = val; updateReaction(); }
    </script>
</body>
</html>
