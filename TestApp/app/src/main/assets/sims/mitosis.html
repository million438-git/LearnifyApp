<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        body { margin: 0; background: #f8fafc; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        canvas { background: white; border-radius: 50%; box-shadow: 0 0 20px rgba(0,0,0,0.1); border: 4px solid #10b981; }
        #label { margin-top: 20px; font-weight: bold; color: #059669; font-size: 20px; }
        #desc { font-size: 14px; color: #64748b; margin-top: 5px; text-align: center; padding: 0 20px; }
    </style>
</head>
<body>
    <canvas id="cellCanvas" width="300" height="300"></canvas>
    <div id="label">Interphase</div>
    <div id="desc">DNA is replicated and the cell prepares for division.</div>

    <script>
        const canvas = document.getElementById('cellCanvas');
        const ctx = canvas.getContext('2d');
        const label = document.getElementById('label');
        const desc = document.getElementById('desc');

        let phase = 0;
        const phases = [
            { name: "Interphase", desc: "DNA is replicated and the cell prepares for division.", color: "#34d399" },
            { name: "Prophase", desc: "Chromatin condenses into chromosomes. The nuclear envelope breaks down.", color: "#10b981" },
            { name: "Metaphase", desc: "Chromosomes line up at the equatorial plate.", color: "#059669" },
            { name: "Anaphase", desc: "Sister chromatids separate and move towards opposite poles.", color: "#047857" },
            { name: "Telophase", desc: "New nuclear envelopes form. The cell begins to pinch in two.", color: "#065f46" },
            { name: "Cytokinesis", desc: "The cytoplasm divides, resulting in two identical daughter cells.", color: "#064e3b" }
        ];

        function drawCell() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = 150, cy = 150;

            ctx.beginPath();
            ctx.arc(cx, cy, 140, 0, Math.PI * 2);
            ctx.fillStyle = "#ecfdf5";
            ctx.fill();

            ctx.strokeStyle = phases[phase].color;
            ctx.lineWidth = 5;
            ctx.stroke();

            if (phase === 0) { // Interphase
                ctx.beginPath();
                ctx.arc(cx, cy, 60, 0, Math.PI * 2);
                ctx.fillStyle = "#d1fae5";
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = "#059669";
                for(let i=0; i<20; i++) ctx.fillRect(cx-30+Math.random()*60, cy-30+Math.random()*60, 2, 2);
            } else if (phase === 1) { // Prophase
                ctx.lineWidth = 3;
                drawChromosome(cx-20, cy-10, 15, phases[phase].color);
                drawChromosome(cx+20, cy+15, 15, phases[phase].color);
            } else if (phase === 2) { // Metaphase
                drawChromosome(cx, cy-40, 15, phases[phase].color);
                drawChromosome(cx, cy, 15, phases[phase].color);
                drawChromosome(cx, cy+40, 15, phases[phase].color);
            } else if (phase === 3) { // Anaphase
                drawChromatid(cx-40, cy-40, 10, phases[phase].color, -1);
                drawChromatid(cx+40, cy-40, 10, phases[phase].color, 1);
                drawChromatid(cx-40, cy+40, 10, phases[phase].color, -1);
                drawChromatid(cx+40, cy+40, 10, phases[phase].color, 1);
            } else if (phase === 4 || phase === 5) { // Telophase/Cyto
                const offset = phase === 5 ? 60 : 30;
                ctx.beginPath();
                ctx.arc(cx-offset, cy, 50, 0, Math.PI*2);
                ctx.arc(cx+offset, cy, 50, 0, Math.PI*2);
                ctx.fillStyle = "#d1fae5";
                ctx.fill();
                ctx.stroke();
            }
        }

        function drawChromosome(x, y, r, color) {
            ctx.beginPath();
            ctx.moveTo(x-r, y-r); ctx.lineTo(x+r, y+r);
            ctx.moveTo(x+r, y-r); ctx.lineTo(x-r, y+r);
            ctx.strokeStyle = color;
            ctx.stroke();
        }

        function drawChromatid(x, y, r, color, dir) {
            ctx.beginPath();
            ctx.moveTo(x, y-r); ctx.lineTo(x+r*dir, y); ctx.lineTo(x, y+r);
            ctx.strokeStyle = color;
            ctx.stroke();
        }

        function nextStep() {
            phase = (phase + 1) % phases.length;
            label.innerText = phases[phase].name;
            desc.innerText = phases[phase].desc;
            drawCell();
        }

        function resetSim() { phase = 0; nextStep(); phase = 0; drawCell(); }

        drawCell();
    </script>
</body>
</html>
