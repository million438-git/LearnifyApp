<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Rate Lab</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background-color: #f8fafc; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { color: #1e293b; text-align: center; }
        .cross-container { width: 200px; height: 200px; border: 2px solid #cbd5e1; margin: 30px auto; position: relative; display: flex; align-items: center; justify-content: center; background: white; }
        .cross { font-size: 150px; color: #ef4444; font-weight: bold; }
        .liquid-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0); transition: background-color 0.1s; pointer-events: none; }
        .controls { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .timer { font-size: 32px; font-family: monospace; text-align: center; color: #4f46e5; margin: 10px 0; }
        button { background: #4f46e5; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .stats { background: #f1f5f9; padding: 15px; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reaction Rate: Sodium Thiosulfate & HCl</h1>
        <p>Measure the time it takes for the precipitate to obscure the red cross.</p>

        <div class="cross-container">
            <div class="cross">×</div>
            <div id="overlay" class="liquid-overlay"></div>
        </div>

        <div class="timer" id="timer">0.00s</div>

        <div class="controls">
            <button id="startBtn" onclick="startReaction()">Start Reaction</button>
            <button onclick="resetSim()" style="background: #94a3b8;">Reset</button>
        </div>

        <div class="stats">
            <div>Temperature: <span id="tempDisp">25</span>°C</div>
            <div>Concentration: <span id="concDisp">1.0</span> M</div>
        </div>
    </div>

    <script>
        let startTime;
        let timerInterval;
        let running = false;
        let concentration = 1.0;
        let opacity = 0;

        function setConc(val) {
            concentration = val / 10;
            document.getElementById('concDisp').innerText = concentration.toFixed(1);
        }

        function startReaction() {
            if (running) return;
            running = true;
            startTime = Date.now();
            document.getElementById('startBtn').disabled = true;

            const duration = 20 / concentration; // Higher concentration = faster reaction

            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                document.getElementById('timer').innerText = elapsed.toFixed(2) + 's';

                opacity = elapsed / duration;
                if (opacity > 1) opacity = 1;
                document.getElementById('overlay').style.backgroundColor = `rgba(255, 255, 255, ${opacity})`;

                if (opacity >= 0.95) {
                    clearInterval(timerInterval);
                    document.getElementById('timer').style.color = '#ef4444';
                }
            }, 50);
        }

        function resetSim() {
            clearInterval(timerInterval);
            running = false;
            opacity = 0;
            document.getElementById('timer').innerText = '0.00s';
            document.getElementById('timer').style.color = '#4f46e5';
            document.getElementById('overlay').style.backgroundColor = 'rgba(255, 255, 255, 0)';
            document.getElementById('startBtn').disabled = false;
        }
    </script>
</body>
</html>
