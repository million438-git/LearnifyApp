<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; background: #fafafa; padding: 15px; }
        .phone { width: 100px; height: 180px; background: #18181b; border: 3px solid #52525b; border-radius: 12px; margin: 20px auto; position: relative; }
        .battery { width: 40px; height: 70px; border: 2px solid white; margin: 50px auto; border-radius: 4px; position: relative; }
        .level { position: absolute; bottom: 0; width: 100%; background: #22c55e; animation: charge 2s infinite; }
        @keyframes charge { from { height: 0%; } to { height: 100%; } }
        .electron { position: absolute; width: 5px; height: 5px; background: #fbbf24; border-radius: 50%; left: 50%; bottom: -30px; animation: flow 1s infinite linear; }
        @keyframes flow { from { bottom: -30px; opacity: 1; } to { bottom: 50px; opacity: 0; } }
        .exp { text-align: left; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 20px; }
    </style>
</head>
<body>
    <h3>🏙️ Science Around You: Phone Charging</h3>
    <div class="phone">
        <div class="battery"><div class="level"></div></div>
        <div class="electron"></div>
    </div>
    <div class="exp">
        <b>Topic: Electric Circuits</b><br>
        <p>When you plug in your phone, a <b>closed circuit</b> is formed. Electrons flow from the power bank into your battery, storing chemical energy.</p>
        <p><i>Real Application: Current & Potential Difference.</i></p>
    </div>
</body>
</html>
