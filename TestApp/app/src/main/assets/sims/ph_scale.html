<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PH Scale Investigation</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f0f9ff; color: #1e293b; overflow-x: hidden; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #0369a1; text-align: center; margin-bottom: 10px; }
        .ph-scale { width: 100%; height: 40px; background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff); border-radius: 20px; margin: 30px 0; position: relative; border: 2px solid #ddd; }
        .ph-marker { position: absolute; top: -10px; width: 4px; height: 60px; background: #333; transition: left 0.5s ease; }
        .ph-value-display { text-align: center; font-size: 48px; font-weight: bold; margin: 20px 0; color: #0369a1; }
        .beaker-container { display: flex; justify-content: center; margin: 30px 0; }
        .beaker { width: 120px; height: 150px; border: 4px solid #94a3b8; border-top: none; border-radius: 0 0 20px 20px; position: relative; overflow: hidden; background: rgba(255,255,255,0.5); }
        .liquid { position: absolute; bottom: 0; width: 100%; height: 60%; transition: background-color 0.5s ease; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        button { background: #0369a1; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #075985; }
        .info-card { background: #f8fafc; padding: 15px; border-radius: 10px; margin-top: 20px; border-left: 5px solid #0369a1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>pH Scale Investigation</h1>

        <div class="ph-scale">
            <div id="marker" class="ph-marker" style="left: 50%;"></div>
        </div>

        <div class="ph-value-display">pH: <span id="phValue">7.0</span></div>

        <div class="beaker-container">
            <div class="beaker">
                <div id="liquid" class="liquid" style="background-color: #00ff00;"></div>
            </div>
        </div>

        <div class="controls">
            <button onclick="test('Lemon Juice', 2.0, '#ff4d4d')">Lemon Juice</button>
            <button onclick="test('Pure Water', 7.0, '#00ff00')">Pure Water</button>
            <button onclick="test('Soap Water', 10.0, '#4d4dff')">Soap Water</button>
            <button onclick="test('Bleach', 13.0, '#8b00ff')">Bleach</button>
        </div>

        <div class="info-card">
            <h3 id="sampleName">Sample: Pure Water</h3>
            <p id="sampleDesc">Neutral substance. Equal concentration of H+ and OH- ions.</p>
        </div>
    </div>

    <script>
        function test(name, ph, color) {
            document.getElementById('phValue').innerText = ph.toFixed(1);
            document.getElementById('marker').style.left = (ph / 14 * 100) + '%';
            document.getElementById('liquid').style.backgroundColor = color;
            document.getElementById('sampleName').innerText = "Sample: " + name;

            let desc = "";
            if(ph < 7) desc = "Acidic substance. High concentration of Hydrogen ions (H+).";
            else if(ph > 7) desc = "Basic (Alkaline) substance. High concentration of Hydroxide ions (OH-).";
            else desc = "Neutral substance. Equal concentration of H+ and OH- ions.";
            document.getElementById('sampleDesc').innerText = desc;
        }

        function changeSample(val) {
            // Mapping slider 1-10 to different samples
            const samples = [
                {n: "Battery Acid", p: 0.5, c: "#ff0000"},
                {n: "Stomach Acid", p: 1.5, c: "#ff3300"},
                {n: "Vinegar", p: 2.5, c: "#ff6600"},
                {n: "Tomato Juice", p: 4.0, c: "#ff9900"},
                {n: "Milk", p: 6.5, c: "#ccff33"},
                {n: "Pure Water", p: 7.0, c: "#00ff00"},
                {n: "Baking Soda", p: 8.5, c: "#00ff99"},
                {n: "Antacid", p: 10.5, c: "#0099ff"},
                {n: "Soapy Water", p: 12.0, c: "#3300ff"},
                {n: "Drain Cleaner", p: 14.0, c: "#8b00ff"}
            ];
            const s = samples[Math.min(val-1, 9)];
            test(s.n, s.p, s.c);
        }
    </script>
</body>
</html>
