<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; background: #fdf2f8; padding: 15px; }
        .router { width: 80px; height: 30px; background: #1e293b; border-radius: 5px; margin: 20px auto; position: relative; }
        .antenna { width: 4px; height: 40px; background: #1e293b; position: absolute; top: -35px; left: 15px; }
        .wave { position: absolute; border: 3px solid #db2777; border-radius: 50%; top: -60px; left: 0; opacity: 0; animation: waveOut 2s infinite; }
        @keyframes waveOut { from { width: 20px; height: 10px; left: 30px; opacity: 1; } to { width: 150px; height: 75px; left: -35px; opacity: 0; } }
        .exp { text-align: left; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 50px; }
    </style>
</head>
<body>
    <h3>🏙️ Science Around You: Wi-Fi Waves</h3>
    <div class="router">
        <div class="antenna"></div>
        <div class="wave"></div>
        <div class="wave" style="animation-delay: 0.5s;"></div>
    </div>
    <div class="exp">
        <b>Topic: Electromagnetic Waves</b><br>
        <p>Your Wi-Fi router sends invisible <b>radio waves</b> through the air. These waves carry data to your phone using frequency and amplitude modulation.</p>
        <p><i>Real Application: Wave Properties & Frequency.</i></p>
    </div>
</body>
</html>
