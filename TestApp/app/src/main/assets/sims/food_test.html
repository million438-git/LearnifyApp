<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        body { margin: 0; background: #fefce8; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .test-tubes { display: flex; gap: 20px; margin-bottom: 30px; }
        .tube { width: 40px; height: 150px; border: 3px solid #94a3b8; border-top: none; border-radius: 0 0 20px 20px; position: relative; background: rgba(255,255,255,0.5); overflow: hidden; }
        .liquid { position: absolute; bottom: 0; width: 100%; height: 60%; transition: background 1s; background: #e2e8f0; }
        .label { margin-top: 10px; font-size: 12px; text-align: center; color: #475569; }
        #msg { font-weight: bold; color: #854d0e; height: 24px; }
    </style>
</head>
<body>
    <div id="msg">Select a reagent to test the samples</div>
    <div class="test-tubes">
        <div><div class="tube"><div id="l1" class="liquid"></div></div><div class="label">Sample A</div></div>
        <div><div class="tube"><div id="l2" class="liquid"></div></div><div class="label">Sample B</div></div>
        <div><div class="tube"><div id="l3" class="liquid"></div></div><div class="label">Sample C</div></div>
    </div>
    <script>
        function addReagent() {
            document.getElementById('l1').style.background = "#1e3a8a"; // Blue-black for starch
            document.getElementById('l2').style.background = "#f97316"; // Orange for sugar
            document.getElementById('l3').style.background = "#a855f7"; // Purple for protein
            document.getElementById('msg').innerText = "Test Complete: Colors indicate presence of nutrients.";
        }
    </script>
</body>
</html>
