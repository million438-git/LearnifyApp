<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; background: #fff5f5; padding: 15px; }
        .eye-container { width: 280px; height: 200px; margin: 20px auto; position: relative; background: white; border-radius: 100px; border: 4px solid #334155; overflow: hidden; }
        .pupil { width: 40px; height: 40px; background: black; border-radius: 50%; position: absolute; left: 120px; top: 80px; transition: 0.3s; cursor: pointer; }
        .lens { width: 20px; height: 60px; border: 2px solid #3b82f6; border-radius: 50%; position: absolute; left: 100px; top: 70px; cursor: pointer; }
        .retina { width: 10px; height: 180px; background: #fecaca; position: absolute; right: 10px; top: 10px; border-radius: 5px; cursor: pointer; }
        .cornea { width: 30px; height: 100px; border-left: 5px solid #93c5fd; position: absolute; left: 0; top: 50px; border-radius: 50%; cursor: pointer; }
        .light-ray { position: absolute; height: 2px; background: #fbbf24; top: 100px; left: -50px; width: 0; transition: 0.5s; }
        .info-panel { background: #450a0a; color: white; padding: 15px; border-radius: 10px; text-align: left; margin-top: 20px; min-height: 80px; }
        input { width: 80%; margin-top: 20px; }
    </style>
</head>
<body>
    <h3>👁️ Interactive Diagram: Human Eye</h3>
    <p>Tap parts to isolate. Drag slider to change Light Intensity.</p>

    <div class="eye-container">
        <div class="cornea" onclick="show('Cornea', 'The transparent outer layer. It refracts (bends) light into the eye.')"></div>
        <div class="lens" onclick="show('Lens', 'Changes shape to focus light onto the retina.')"></div>
        <div id="pupil" class="pupil" onclick="show('Pupil', 'The opening that lets light in. It shrinks in bright light.')"></div>
        <div class="retina" onclick="show('Retina', 'Contains photoreceptors that convert light into nerve impulses.')"></div>
        <div id="ray" class="light-ray"></div>
    </div>

    <label>Light Intensity: <span id="intVal">Low</span></label><br>
    <input type="range" min="10" max="80" value="40" oninput="updateLight(this.value)">

    <div class="info-panel" id="info">Tap an eye component...</div>

    <script>
        function show(name, desc) {
            document.getElementById('info').innerHTML = `<b>${name}</b><br>${desc}`;
            document.getElementById('ray').style.width = '200px';
            setTimeout(() => { document.getElementById('ray').style.width = '0'; }, 1000);
        }
        function updateLight(val) {
            let p = document.getElementById('pupil');
            let size = 100 - val;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = (140 - size/2) + 'px';
            p.style.top = (100 - size/2) + 'px';
            document.getElementById('intVal').innerText = val > 60 ? "High ☀️" : (val < 30 ? "Low 🌑" : "Medium ☁️");
            document.getElementById('info').innerHTML = "<b>System Reacted: Accommodation</b><br>The iris muscles contracted to shrink the pupil, protecting the retina from excess light.";
        }
    </script>
</body>
</html>
