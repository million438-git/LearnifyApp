<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #0f172a; color: white; margin: 0; padding: 15px; overflow: hidden; touch-action: none; }
        .lab-bench { background: #1e293b; border-radius: 20px; padding: 20px; position: relative; height: 250px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-around; }

        .spoon-container { position: relative; width: 120px; height: 180px; display: flex; flex-direction: column; align-items: center; }
        .spoon { width: 30px; height: 140px; background: #94a3b8; border-radius: 15px 15px 5px 5px; position: relative; transition: background 0.5s linear; }
        .wooden { background: #8b4513; }
        .metal { background: #cbd5e1; }

        .beaker { width: 100%; height: 60px; background: rgba(59, 130, 246, 0.3); border: 2px solid #3b82f6; border-top: none; border-radius: 0 0 10px 10px; position: absolute; bottom: 0; }
        .steam { position: absolute; top: -20px; width: 100%; text-align: center; font-size: 20px; animation: steamMove 2s infinite linear; opacity: 0; }
        @keyframes steamMove { 0% { transform: translateY(0); opacity: 0.5; } 100% { transform: translateY(-30px); opacity: 0; } }

        .temp-dot { width: 10px; height: 10px; background: #3b82f6; border-radius: 50%; position: absolute; transition: background 0.5s, transform 0.5s; }

        .controls { background: #334155; padding: 15px; border-radius: 15px; text-align: left; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; background: #ef4444; color: white; margin-top: 10px; }

        .exp { font-size: 13px; color: #94a3b8; margin-top: 10px; line-height: 1.4; }
        .hot { background: #ef4444 !important; box-shadow: 0 0 10px #ef4444; }
    </style>
</head>
<body>
    <div class="lab-bench">
        <!-- Metal Spoon -->
        <div class="spoon-container">
            <div id="steam-m" class="steam">♨️</div>
            <div id="spoon-m" class="spoon metal">
                <div id="dot-m" class="temp-dot" style="top: 10px; left: 10px;"></div>
            </div>
            <div class="beaker"></div>
            <div style="font-size: 10px; margin-top: 5px;">METAL</div>
        </div>

        <!-- Wooden Spoon -->
        <div class="spoon-container">
            <div id="steam-w" class="steam">♨️</div>
            <div id="spoon-w" class="spoon wooden">
                <div id="dot-w" class="temp-dot" style="top: 10px; left: 10px;"></div>
            </div>
            <div class="beaker"></div>
            <div style="font-size: 10px; margin-top: 5px;">WOOD</div>
        </div>
    </div>

    <div class="controls">
        <b>Simulation: Thermal Conductivity</b>
        <button onclick="startHeat()">🔥 Pour Boiling Water</button>
        <div class="exp">
            <b>See it:</b> Metal is a <b>Conductor</b>. Heat flows rapidly (Blue → Red). Wood is an <b>Insulator</b>. Heat transfer is extremely slow.
        </div>
    </div>

    <script>
        function startHeat() {
            document.getElementById('steam-m').style.opacity = "1";
            document.getElementById('steam-w').style.opacity = "1";

            // Metal heats fast
            setTimeout(() => {
                document.getElementById('spoon-m').style.background = "linear-gradient(to top, #ef4444, #991b1b)";
                document.getElementById('dot-m').classList.add('hot');
            }, 500);

            // Wood stays cool
            setTimeout(() => {
                document.getElementById('spoon-w').style.background = "linear-gradient(to top, #8b4513, #451a03)";
                // Dot stays blue/dark
            }, 3000);
        }
    </script>
</body>
</html>
