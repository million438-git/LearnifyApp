<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; background: #fef2f2; padding: 20px; overflow: hidden; }
        .circuit { width: 250px; height: 150px; border: 4px solid #334155; margin: 20px auto; position: relative; background: white; border-radius: 10px; }
        .wire { position: absolute; background: #475569; transition: background 0.5s; }
        .w-top { top: 20px; left: 20px; right: 20px; height: 4px; }
        .w-bottom { bottom: 20px; left: 20px; right: 20px; height: 4px; }
        .w-left { top: 20px; bottom: 20px; left: 20px; width: 4px; }
        .w-right { top: 20px; bottom: 20px; right: 20px; width: 4px; }
        .battery { position: absolute; left: 100px; bottom: 10px; width: 50px; height: 25px; background: #1e293b; color: white; font-size: 10px; line-height: 25px; border-radius: 3px; z-index: 2; }
        .load { position: absolute; right: 10px; top: 60px; width: 20px; height: 30px; background: #3b82f6; border-radius: 3px; }

        .smoke { position: absolute; width: 10px; height: 10px; background: rgba(100,116,139,0.5); border-radius: 50%; opacity: 0; }
        @keyframes smokeUp {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-50px) scale(3); opacity: 0; }
        }

        .alert-box { background: #ef4444; color: white; padding: 15px; border-radius: 10px; text-align: left; margin-top: 20px; display: none; border: 2px solid #b91c1c; }
        .controls { margin-top: 20px; }
        input { width: 80%; }
        .danger { background: #ef4444 !important; box-shadow: 0 0 15px #ef4444; }
    </style>
</head>
<body>
    <h3>⚠️ Error Alert: Overheating Circuit</h3>
    <p>Increasing voltage beyond component limits causes <b>Joule Heating</b>.</p>

    <div class="circuit" id="circuit">
        <div class="wire w-top" id="w1"></div>
        <div class="wire w-bottom" id="w2"></div>
        <div class="wire w-left" id="w3"></div>
        <div class="wire w-right" id="w4"></div>
        <div class="battery">9V</div>
        <div class="load" id="load"></div>
        <div id="smoke1" class="smoke" style="top: 50px; right: 15px;"></div>
        <div id="smoke2" class="smoke" style="top: 60px; right: 15px;"></div>
    </div>

    <div class="controls">
        <label>Voltage ($V$): <span id="vVal">9</span>V</label><br>
        <input type="range" min="1" max="100" value="9" oninput="updateVoltage(this.value)">
    </div>

    <div class="alert-box" id="alert">
        <b>🛑 CRITICAL FAILURE: MELTDOWN</b><br>
        Current flow ($I = V/R$) exceeded wire capacity. Heat generated ($P = I^2 R$) is melting the insulation.
    </div>

    <script>
        function updateVoltage(val) {
            document.getElementById('vVal').innerText = val;
            let wires = document.querySelectorAll('.wire');
            let alert = document.getElementById('alert');
            let smokes = document.querySelectorAll('.smoke');

            if (val > 70) {
                wires.forEach(w => w.classList.add('danger'));
                alert.style.display = 'block';
                smokes.forEach(s => s.style.animation = 'smokeUp 1s infinite');
            } else {
                wires.forEach(w => w.classList.remove('danger'));
                alert.style.display = 'none';
                smokes.forEach(s => s.style.animation = 'none');
                // Color wires based on "heat"
                let heat = Math.floor((val/70)*150);
                let color = `rgb(${71+heat}, ${85}, ${105})`;
                wires.forEach(w => w.style.backgroundColor = color);
            }
        }
    </script>
</body>
</html>
