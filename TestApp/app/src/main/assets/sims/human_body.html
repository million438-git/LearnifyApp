<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        body { margin: 0; background: #fef2f2; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .torso { width: 160px; height: 260px; background: #fee2e2; border: 4px solid #f87171; border-radius: 40px 40px 20px 20px; position: relative; }
        .organ { position: absolute; border: 2px solid rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        .organ:hover { transform: scale(1.1); }
        .heart { width: 30px; height: 30px; background: #ef4444; border-radius: 50%; top: 60px; left: 75px; color: white; }
        .lungs { width: 100px; height: 80px; top: 50px; left: 30px; z-index: -1; display: flex; justify-content: space-between; border: none; }
        .lung { width: 45px; height: 80px; background: #fca5a5; border-radius: 20px 20px 10px 10px; }
        .stomach { width: 50px; height: 40px; background: #f97316; border-radius: 0 0 20px 20px; top: 130px; left: 80px; color: white; }
        .liver { width: 60px; height: 40px; background: #991b1b; border-radius: 40px 10px 10px 40px; top: 125px; left: 25px; color: white; }
        .intestines { width: 80px; height: 60px; background: #ea580c; border-radius: 10px; top: 180px; left: 40px; color: white; }
        #info-box { margin-top: 20px; background: white; padding: 15px; border-radius: 12px; border: 2px solid #ef4444; width: 80%; text-align: center; }
    </style>
</head>
<body>
    <div class="torso">
        <div class="lungs"><div class="lung"></div><div class="lung"></div></div>
        <div class="organ heart" onclick="show('Heart', 'Pumps blood throughout the body.')">❤️</div>
        <div class="organ liver" onclick="show('Liver', 'Filters toxins and produces bile.')">Liver</div>
        <div class="organ stomach" onclick="show('Stomach', 'Breaks down food using acid.')">Stomach</div>
        <div class="organ intestines" onclick="show('Intestines', 'Absorb nutrients and water.')">Intestines</div>
    </div>
    <div id="info-box">Tap an organ to explore the human body</div>
    <script>
        function show(name, desc) {
            document.getElementById('info-box').innerHTML = "<b>" + name + "</b><br/>" + desc;
        }
        function rotateModel(val) {
            document.querySelector('.torso').style.transform = `rotateY(${val}deg)`;
        }
    </script>
</body>
</html>
