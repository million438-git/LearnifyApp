<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #0f172a; color: white; margin: 0; padding: 15px; overflow: hidden; touch-action: none; }
        .lab-bench { background: #1e293b; border-radius: 20px; padding: 20px; position: relative; height: 250px; margin-bottom: 20px; border: 1px solid #334155; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }

        .surface { width: 80%; height: 10px; background: #475569; border-radius: 5px; position: relative; }
        .skin { width: 80%; height: 40px; background: #fda4af; border-radius: 0 0 10px 10px; margin-bottom: 20px; position: relative; overflow: hidden; }
        .indentation { position: absolute; top: 0; left: 50%; width: 0; height: 0; background: #e11d48; transform: translateX(-50%); transition: all 0.1s linear; border-radius: 0 0 50% 50%; opacity: 0.6; }

        .object { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); background: #cbd5e1; transition: width 0.3s ease; }
        .thumbtack-head { width: 60px; height: 10px; background: #94a3b8; border-radius: 5px 5px 0 0; }
        .thumbtack-pin { width: 4px; height: 40px; background: #cbd5e1; margin: 0 auto; }

        .controls { background: #334155; padding: 15px; border-radius: 15px; text-align: left; }
        .control-row { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        input[type=range] { width: 100%; }

        .stats { display: flex; justify-content: space-between; margin-top: 10px; font-weight: bold; font-size: 14px; }
        .p-high { color: #f43f5e; }
        .p-low { color: #10b981; }

        .exp { font-size: 13px; color: #94a3b8; margin-top: 15px; line-height: 1.4; }
        b { color: #3b82f6; }
    </style>
</head>
<body>
    <div class="lab-bench">
        <div id="obj" class="object">
            <div id="head" class="thumbtack-head"></div>
            <div id="pin" class="thumbtack-pin"></div>
        </div>
        <div class="surface"></div>
        <div class="skin">
            <div id="indent" class="indentation"></div>
        </div>
    </div>

    <div class="controls">
        <div class="control-row">
            <label>Tip Surface Area ($A$): <span id="areaVal">Small (Sharp)</span></label>
            <input type="range" id="areaInput" min="2" max="60" value="4" oninput="updateSim()">
        </div>
        <div class="control-row">
            <label>Applied Force ($F$): <span id="forceVal">20</span> N</label>
            <input type="range" id="forceInput" min="0" max="100" value="20" oninput="updateSim()">
        </div>

        <div class="stats">
            <span>Pressure ($P = F/A$):</span>
            <span id="pressureVal" class="p-high">High</span>
        </div>

        <div class="exp">
            <b>Pressure Principle:</b> Pressure is force per unit area. A sharp tip has a <b>tiny area</b>, concentrating all the force into one spot, creating massive pressure.
        </div>
    </div>

    <script>
        function updateSim() {
            const area = document.getElementById('areaInput').value;
            const force = document.getElementById('forceInput').value;

            document.getElementById('forceVal').innerText = force;
            document.getElementById('areaVal').innerText = area > 40 ? "Large (Flat)" : (area < 10 ? "Small (Sharp)" : "Medium");

            // Update Visual Object
            const pin = document.getElementById('pin');
            pin.style.width = area + "px";

            const head = document.getElementById('head');
            head.style.width = Math.max(60, parseInt(area) + 20) + "px";

            // Calculate Pressure Effect
            const pressure = force / area;
            const indent = document.getElementById('indent');

            // Indentation depth depends on pressure
            const depth = Math.min(40, pressure * 5);
            indent.style.height = depth + "px";
            indent.style.width = (parseInt(area) + depth) + "px";

            const pVal = document.getElementById('pressureVal');
            pVal.innerText = pressure > 10 ? "VERY HIGH ⚠️" : (pressure < 2 ? "Low ✅" : "Moderate");
            pVal.className = pressure > 10 ? "p-high" : (pressure < 2 ? "p-low" : "");

            // Visual feedback: color intensity
            const intensity = Math.min(255, pressure * 20);
            indent.style.backgroundColor = `rgb(${150 + intensity/2}, 29, 72)`;
        }

        updateSim();
    </script>
</body>
</html>
