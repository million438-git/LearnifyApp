<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        body { margin: 0; background: #fdf2f8; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        canvas { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 2px solid #ec4899; }
        #info { margin-top: 20px; text-align: center; color: #9d174d; }
    </style>
</head>
<body>
    <canvas id="dnaCanvas" width="340" height="400"></canvas>
    <div id="info">
        <b id="stepTitle">DNA Replication</b><br/>
        <span id="stepDesc">Helicase separates the double helix.</span>
    </div>
    <script>
        const canvas = document.getElementById('dnaCanvas');
        const ctx = canvas.getContext('2d');
        let progress = 0;

        function draw() {
            ctx.clearRect(0,0,340,400);
            const cx = 170;
            for(let i=0; i<20; i++) {
                let y = i * 20 + 20;
                let open = i < progress ? (progress - i) * 15 : 0;
                ctx.beginPath();
                ctx.arc(cx - open, y, 5, 0, Math.PI*2);
                ctx.fillStyle = "#3b82f6"; ctx.fill();
                ctx.beginPath();
                ctx.arc(cx + open, y, 5, 0, Math.PI*2);
                ctx.fillStyle = "#ef4444"; ctx.fill();
                if(open < 5) {
                    ctx.beginPath(); ctx.moveTo(cx-5, y); ctx.lineTo(cx+5, y);
                    ctx.strokeStyle = "#94a3b8"; ctx.stroke();
                }
            }
        }
        function nextStep() {
            progress = (progress + 1) % 20;
            draw();
        }
        function resetSim() { progress = 0; draw(); }
        draw();
    </script>
</body>
</html>
