<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intermediate Chemistry Lab</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background-color: #f8fafc; color: #1e293b; }
        .container { max-width: 850px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .header { border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; text-align: center; }
        .lab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .panel { padding: 15px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f1f5f9; }
        .experiment-box { height: 200px; background: #fff; border: 2px solid #4f46e5; border-radius: 10px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .beaker { width: 60px; height: 80px; border: 3px solid #64748b; border-top: none; border-radius: 0 0 10px 10px; position: relative; }
        .liquid { position: absolute; bottom: 0; width: 100%; height: 40%; background: #6366f1; transition: all 0.5s; }
        .controls { text-align: center; margin-top: 15px; }
        button { background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        #log { margin-top: 15px; font-size: 0.9em; color: #64748b; height: 60px; overflow-y: auto; border: 1px solid #e2e8f0; padding: 10px; border-radius: 5px; background: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Intermediate Lab Module</h1>
            <p>Quantitative & Qualitative Analysis Simulation</p>
        </div>
        <div class="lab-grid">
            <div class="panel">
                <h3>Apparatus Setup</h3>
                <ul>
                    <li>Volumetric Flask (250mL)</li>
                    <li>Digital Balance (±0.01g)</li>
                    <li>Magnetic Stirrer</li>
                </ul>
            </div>
            <div class="panel">
                <h3>Parameters</h3>
                <p>Molarity: <span id="molVal">0.10</span> M</p>
                <p>Volume: <span id="volVal">50.0</span> mL</p>
            </div>
        </div>
        <div class="experiment-box">
            <div class="beaker">
                <div id="liquid" class="liquid"></div>
            </div>
        </div>
        <div class="controls">
            <button onclick="mix()">Add Reagent</button>
            <button onclick="reset()">Clear Flask</button>
        </div>
        <div id="log">Awaiting input...</div>
    </div>
    <script>
        function mix() {
            const l = document.getElementById('liquid');
            const log = document.getElementById('log');
            let h = parseInt(l.style.height || 40);
            if(h < 90) {
                h += 10;
                l.style.height = h + '%';
                log.innerHTML += "<div>> Added 10mL of reagent. Reaction progressing...</div>";
                log.scrollTop = log.scrollHeight;
            }
        }
        function reset() {
            document.getElementById('liquid').style.height = '0%';
            document.getElementById('log').innerHTML = "Flask cleared.";
        }
    </script>
</body>
</html>
