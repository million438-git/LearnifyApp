<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; background: #e0f2fe; padding: 15px; }
        .fridge { width: 120px; height: 200px; background: #94a3b8; border: 4px solid #475569; border-radius: 10px; margin: 20px auto; position: relative; }
        .line { position: absolute; width: 100%; height: 4px; background: #475569; top: 70px; }
        .coil { width: 80px; height: 100px; border: 3px solid #3b82f6; border-radius: 5px; margin: 10px auto; opacity: 0.3; }
        .hot { background: #ef4444; width: 30px; height: 30px; border-radius: 50%; position: absolute; right: -40px; top: 100px; animation: moveOut 2s infinite linear; }
        @keyframes moveOut { from { transform: translateX(-50px); opacity: 1; } to { transform: translateX(20px); opacity: 0; } }
        .exp { text-align: left; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 20px; }
    </style>
</head>
<body>
    <h3>🏙️ Science Around You: Refrigerator</h3>
    <div class="fridge">
        <div class="line"></div>
        <div class="coil"></div>
        <div class="hot"></div>
    </div>
    <div class="exp">
        <b>Topic: Thermodynamics</b><br>
        <p>A fridge doesn't "add cold". It <b>removes heat</b> from the inside and pushes it to the outside (that's why the back is warm!).</p>
        <p><i>Real Application: 2nd Law of Thermodynamics.</i></p>
    </div>
</body>
</html>
