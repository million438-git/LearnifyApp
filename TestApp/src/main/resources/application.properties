server.port=${PORT:8080}

# Google Gemini AI Service Configuration
# Using official Google AI Studio production model (free-tier eligible)
gemini.model=${GEMINI_MODEL:gemini-flash-lite-latest}
gemini.api.key=${GEMINI_API_KEY:}

# Firebase Admin verifies ID tokens with Application Default Credentials.
# Keep authentication unavailable unless explicitly enabled for a configured environment.
learnify.firebase.enabled=${LEARNIFY_FIREBASE_AUTH_ENABLED:false}
learnify.firebase.project-id=${FIREBASE_PROJECT_ID:}
